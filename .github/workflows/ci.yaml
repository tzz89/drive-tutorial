name: ci

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # 1. Official way to install pnpm quickly
      #    Version comes from "packageManager" in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 2. Native Node setup with caching to save your free minutes
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      # 3. Clean dependency installation
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy .env.example files
        shell: bash
        run: find . -type f -name ".env.example" -exec sh -c 'cp "$1" "${1%.*}"' _ {} \;

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm check
